<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Security headers (Content-Security-Policy, X-Frame-Options,
      X-Content-Type-Options, Permissions-Policy, HSTS) are sent as real HTTP
      headers from vercel.json. Declaring them as <meta http-equiv> is ignored
      by browsers and logs console errors (e.g. "X-Frame-Options may only be set
      via an HTTP header").
    -->
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />
    <!-- Google Fonts must be loaded via <link> so the CSP in vercel.json can
         allowlist the stylesheet (fonts.googleapis.com) and font files
         (fonts.gstatic.com). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    />
    <title>FlowBooks Freelance Finance Toolkit</title>
    <meta
      name="description"
      content="Track income, manage expenses, send invoices, and estimate taxes  built for freelancers."
    />
    <meta name="author" content="Muhammad Tanveer Abbas" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/FlowBooks.png" />
    <meta name="theme-color" content="#3d6b52" />

    <meta property="og:title" content="FlowBooks — Freelance Finance Toolkit" />
    <meta property="og:description" content="Track income, manage expenses, send invoices, and estimate taxes — built for freelancers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flowbooks-io.vercel.app/" />
    <meta property="og:site_name" content="FlowBooks" />
    <meta property="og:image" content="https://flowbooks-io.vercel.app/FlowBooks.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FlowBooks — Freelance Finance Toolkit" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@themvpguy" />
    <meta name="twitter:title" content="FlowBooks — Freelance Finance Toolkit" />
    <meta name="twitter:description" content="Track income, manage expenses, send invoices, and estimate taxes — built for freelancers." />
    <meta name="twitter:image" content="https://flowbooks-io.vercel.app/FlowBooks.png" />
    <meta name="twitter:image:alt" content="FlowBooks — Freelance Finance Toolkit" />
  </head>

  </body>
</html>
